# [2026-11-24 04:05 PM Johnny Chu - Chu Hoàng Anh] PHASE-003 — nginx cho web open-cake. /api/, /mcp, /ingress/ sẽ proxy sang api ở PHASE-016.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  # [2026-11-24 07:55 PM Johnny Chu - Chu Hoàng Anh] PHASE-016 — /api sang dịch vụ api (biến + resolver: web vẫn khởi động khi chạy một mình).
  # [2026-11-27 11:21 AM Johnny Chu - Chu Hoàng Anh] PHASE-018 S018-4 — tải tệp lên ≤ 25 MB (+ dư): mặc định nginx 1 MB sẽ chặn 413 trước khi tới API
  location /api/ {
    client_max_body_size 27m;
    resolver 127.0.0.11 valid=30s;
    set $api http://api:8120;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }
  # [2026-11-27 11:21 AM Johnny Chu - Chu Hoàng Anh] PHASE-018 S018-4 — vé tải tệp cho Cell / máy kết nối (bộ đĩa): chuyển sang API, không rơi vào trang web
  location /files/v1/ {
    resolver 127.0.0.11 valid=30s;
    set $api http://api:8120;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
