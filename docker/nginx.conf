# [2026-11-24 04:45 PM Johnny Chu - Chu Hoàng Anh] PHASE-003 — nginx cho web open-cake. /api/, /mcp, /ingress/ sẽ proxy sang api ở PHASE-016.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
