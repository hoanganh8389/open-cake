# [2026-11-24 04:05 PM Johnny Chu - Chu Hoàng Anh] PHASE-003 — compose project "cake": hiện chỉ có web (bộ giả lập).
#   PHASE-016 thêm db (postgres:16), db-migrate, api, redis (profile) theo architecture/50-DEPLOYMENT.md.
#   Cổng mặc định 8110 (8088 ketoan, 8096–8099 okt-* đã dùng trên máy này).
# [2026-11-24 07:55 PM Johnny Chu - Chu Hoàng Anh] PHASE-016 S016-6 — thêm db · db-migrate · api: migration nền @bizcity/platform + open-cake một trình chạy;
#   API chỉ lên khi migrate xong; web chuyển /api sang api. Mở http://127.0.0.1:8110/?api=mix ⇒ Hàng hoá chạy máy chủ thật, màn khác còn giả lập.
#   CAKE_SEED_DEV=1 (mặc định, máy dev) gieo đơn vị "hoa-mai" + bảng giá + nhóm hàng GIẢ LẬP; bản thật đặt 0. Redis (profile) để sau.
name: cake

x-log: &log { driver: json-file, options: { max-size: "10m", max-file: "3" } }
x-db-env: &dbenv
  DATABASE_URL: postgres://cake:${DB_PASSWORD:-cake-dev}@db:5432/cake
  CAKE_TENANT: ${CAKE_TENANT:-hoa-mai}
  # [2026-11-24 08:34 PM Johnny Chu - Chu Hoàng Anh] PHASE-007 — khoá + bí mật Hub cho POST /ingress/v1/touch; trống ⇒ cổng nhận trả 503 (không mở không xác thực).
  CAKE_HUB_KEY: ${CAKE_HUB_KEY:-}
  CAKE_HUB_SECRET: ${CAKE_HUB_SECRET:-}
  JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env (xem .env.example) — nền chặn khoá mặc định ở bản production}

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: cake, POSTGRES_USER: cake, POSTGRES_PASSWORD: "${DB_PASSWORD:-cake-dev}" }
    volumes: [cake-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cake -d cake"], interval: 3s, timeout: 3s, retries: 30 }
    restart: unless-stopped
    logging: *log

  db-migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile, args: { BIZCITY_GIT_SHA: "${BIZCITY_GIT_SHA:-}" } }
    image: open-cake-api:0.1.0
    # [2026-11-24 09:07 PM Johnny Chu - Chu Hoàng Anh] PHASE-004 — tạo vai ứng dụng cake_app (không siêu người dùng) sau migration.
    environment: { <<: *dbenv, CAKE_SEED_DEV: "${CAKE_SEED_DEV:-1}", CAKE_APP_ROLE: cake_app }
    command: ["sh", "-c", "node --conditions=cake-dist dist/migrate.js && if [ \"$$CAKE_SEED_DEV\" = 1 ]; then node --conditions=cake-dist dist/seed-dev.js; fi"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
    logging: *log

  api:
    image: open-cake-api:0.1.0
    # [2026-11-24 09:07 PM Johnny Chu - Chu Hoàng Anh] PHASE-004 — API chạy dưới vai cake_app (RLS có hiệu lực); đăng nhập: SSO WordPress, hoặc dev khi CAKE_DEV_AUTH=1 (mặc định TẮT).
    environment:
      <<: *dbenv
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_SET_ROLE: cake_app
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: open-cake-api
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      LOG_DIR: /app/logs
      CAKE_DEV_AUTH: "${CAKE_DEV_AUTH:-0}"
      WP_SSO_SECRET: "${WP_SSO_SECRET:-}"
      WP_SSO_TENANT: "${WP_SSO_TENANT:-hoa-mai}"
      WP_SSO_LOGIN_URL: "${WP_SSO_LOGIN_URL:-}"
    volumes: [cake-logs:/app/logs]   # nhật ký lỗi theo ngày, giữ 30 ngày (R-LOG-9)
    depends_on: { db-migrate: { condition: service_completed_successfully } }
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8120}:8120"
    restart: unless-stopped
    logging: *log

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: open-cake-web:0.1.0
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8110}:80"
    restart: unless-stopped
    logging: *log

volumes:
  cake-db:
  cake-logs:
