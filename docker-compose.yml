# [2026-11-24 04:05 PM Johnny Chu - Chu Hoàng Anh] PHASE-003 — compose project "cake": hiện chỉ có web (bộ giả lập).
#   PHASE-016 thêm db (postgres:16), db-migrate, api, redis (profile) theo architecture/50-DEPLOYMENT.md.
#   Cổng mặc định 8110 (8088 ketoan, 8096–8099 okt-* đã dùng trên máy này).
# [2026-11-24 07:55 PM Johnny Chu - Chu Hoàng Anh] PHASE-016 S016-6 — thêm db · db-migrate · api: migration nền @bizcity/platform + open-cake một trình chạy;
#   API chỉ lên khi migrate xong; web chuyển /api sang api. Mở http://127.0.0.1:8110/?api=mix ⇒ Hàng hoá chạy máy chủ thật, màn khác còn giả lập.
#   CAKE_SEED_DEV=1 (mặc định, máy dev) gieo đơn vị "hoa-mai" + bảng giá + nhóm hàng GIẢ LẬP; bản thật đặt 0. Redis (profile) để sau.
name: cake

x-log: &log { driver: json-file, options: { max-size: "10m", max-file: "3" } }
x-db-env: &dbenv
  DATABASE_URL: postgres://cake:${DB_PASSWORD:-cake-dev}@db:5432/cake
  CAKE_TENANT: ${CAKE_TENANT:-hoa-mai}
  # [2026-11-24 08:34 PM Johnny Chu - Chu Hoàng Anh] PHASE-007 — khoá + bí mật Hub cho POST /ingress/v1/touch; trống ⇒ cổng nhận trả 503 (không mở không xác thực).
  CAKE_HUB_KEY: ${CAKE_HUB_KEY:-}
  CAKE_HUB_SECRET: ${CAKE_HUB_SECRET:-}
  CAKE_HUB_URL: ${CAKE_HUB_URL:-}
  CAKE_HUB_SITE_KEY: ${CAKE_HUB_SITE_KEY:-}
  JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET trong .env (xem .env.example) — nền chặn khoá mặc định ở bản production}

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: cake, POSTGRES_USER: cake, POSTGRES_PASSWORD: "${DB_PASSWORD:-cake-dev}" }
    volumes: [cake-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cake -d cake"], interval: 3s, timeout: 3s, retries: 30 }
    restart: unless-stopped
    logging: *log

  db-migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile, args: { BIZCITY_GIT_SHA: "${BIZCITY_GIT_SHA:-}" } }
    image: open-cake-api:0.1.0
    # [2026-11-24 09:07 PM Johnny Chu - Chu Hoàng Anh] PHASE-004 — tạo vai ứng dụng cake_app (không siêu người dùng) sau migration.
    # [2026-11-26 10:23 PM Johnny Chu - Chu Hoàng Anh] KN K6 — CAKE_CONNECTOR_URL có giá trị (bật profile connector) ⇒ sau migrate / seed cấp khoá nối nội bộ (Tự cài) và ghi vào volume cake-link cho máy kết nối.
    environment: { <<: *dbenv, CAKE_SEED_DEV: "${CAKE_SEED_DEV:-1}", CAKE_APP_ROLE: cake_app, CAKE_SECRET_KEY: "${CAKE_SECRET_KEY:-}", CAKE_CONNECTOR_URL: "${CAKE_CONNECTOR_URL:-}", CAKE_CONNECTOR_LINK_FILE: /link/connector.env }
    volumes: [cake-link:/link]
    command: ["sh", "-c", "node --conditions=cake-dist dist/migrate.js && if [ \"$CAKE_SEED_DEV\" = 1 ]; then node --conditions=cake-dist dist/seed-dev.js; fi && node --conditions=cake-dist dist/connector-link.js"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"
    logging: *log

  api:
    image: open-cake-api:0.1.0
    # [2026-11-24 09:07 PM Johnny Chu - Chu Hoàng Anh] PHASE-004 — API chạy dưới vai cake_app (RLS có hiệu lực); đăng nhập: SSO WordPress, hoặc dev khi CAKE_DEV_AUTH=1 (mặc định TẮT).
    environment:
      <<: *dbenv
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_SET_ROLE: cake_app
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: open-cake-api
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      CAKE_SECRET_KEY: "${CAKE_SECRET_KEY:-}"
      # [2026-11-27 10:51 AM Johnny Chu - Chu Hoàng Anh] PHASE-018 S018-2 — nơi lưu tệp (26-NOI-LUU-TEP): local = volume cake-files (Tự cài, không tự xoá theo tuổi); s3 = bucket R2 RIÊNG TƯ riêng, token quyền hẹp (Q-STOR-3 = B)
      DATA_DIR: /app/data
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      CAKE_PUBLIC_URL: "${CAKE_PUBLIC_URL:-}"
      STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
      STORAGE_S3_ACCESS_KEY: "${STORAGE_S3_ACCESS_KEY:-}"
      STORAGE_S3_SECRET_KEY: "${STORAGE_S3_SECRET_KEY:-}"
      CAKE_OKT_API_KEY: "${CAKE_OKT_API_KEY:-}"
      LOG_DIR: /app/logs
      CAKE_DEV_AUTH: "${CAKE_DEV_AUTH:-0}"
      WP_SSO_SECRET: "${WP_SSO_SECRET:-}"
      WP_SSO_TENANT: "${WP_SSO_TENANT:-hoa-mai}"
      WP_SSO_LOGIN_URL: "${WP_SSO_LOGIN_URL:-}"
    volumes: [cake-logs:/app/logs, cake-files:/app/data]   # nhật ký lỗi theo ngày, giữ 30 ngày (R-LOG-9) · tệp đính kèm (bộ local)
    depends_on: { db-migrate: { condition: service_completed_successfully } }
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8120}:8120"
    restart: unless-stopped
    logging: *log

  # [2026-11-26 10:23 PM Johnny Chu - Chu Hoàng Anh] KN K6 — máy kết nối gọn (zalo-hub-connector: chỉ zca + fbchat-v2, KHÔNG trợ lý / agent / MCP — 25-KET-NOI-KENH §3b). Bật: COMPOSE_PROFILES=connector
  #   và CAKE_CONNECTOR_URL=http://cake-connector:3901 trong .env. Khoá nối nạp từ volume cake-link do db-migrate cấp (không dán tay); phiên Zalo nằm ở volume cake-connector-data (trên máy chủ của bạn).
  #   Ảnh build từ repo zalo-hub (Dockerfile target connector — W4b): đặt CAKE_CONNECTOR_IMAGE nếu dùng tên khác.
  cake-connector:
    image: ${CAKE_CONNECTOR_IMAGE:-zalo-hub-connector:latest}
    profiles: [connector]
    environment:
      CAKE_URL: http://api:8120
      CONNECTOR_PORT: "3901"
      DATA_DIR: /data
      # [2026-11-26 10:39 PM Johnny Chu - Chu Hoàng Anh] KN W4b-2 — Facebook cá nhân (fbchat-v2) trên máy kết nối: TẮT mặc định (tài khoản phụ, có thể bị Facebook kiểm tra); bật: CONNECTOR_FB_ENABLED=true
      FB_PERSONAL_ENABLED: "${CONNECTOR_FB_ENABLED:-false}"
      CREDENTIALS_ENCRYPTION_KEY: "${CONNECTOR_ENCRYPTION_KEY:-}"  # 64 ký tự hex (mã hoá phiên Zalo lưu trên đĩa); trống ⇒ máy kết nối từ chối khởi động
    entrypoint: ["sh", "-c", ". /link/connector.env && export CAKE_CONNECTOR_KEY CAKE_CONNECTOR_SECRET && exec node dist/src/connector/main.js"]
    volumes: [cake-link:/link:ro, cake-connector-data:/data]
    depends_on: { db-migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    logging: *log

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: open-cake-web:0.1.0
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8110}:80"
    restart: unless-stopped
    logging: *log

volumes:
  cake-db:
  cake-logs:
  cake-files:
  cake-link:
  cake-connector-data:
